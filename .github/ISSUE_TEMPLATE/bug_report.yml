name: Сообщение об ошибке
description: Поведение шлюза не соответствует ожидаемому (ошибки интерфейса, аномалии стриминга, ошибки ротации / охлаждения, сбои задач по расписанию и т.д.)
title: "[Bug] Одним предложением опишите симптом, не пишите просто «не работает»"
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > **Перед отправкой убедитесь в этих трёх вещах, иначе issue попросят дополнить или закроют как «невоспроизводимое»:**
        >
        > 1. Прочитаны разделы README [Быстрый старт](https://github.com/Sliverkiss/workbuddy2api#быстрый-старт), [Описание конфигурации](https://github.com/Sliverkiss/workbuddy2api#описание-конфигурации) и [Частые вопросы](https://github.com/Sliverkiss/workbuddy2api#частые-вопросы);
        > 2. Исключена проблема конфигурации на стороне клиента (проверено прямым вызовом шлюза через curl из раздела «Минимальное воспроизведение» ниже);
        > 3. **Удалены все учётные данные и приватная информация**: `api_key`, токены из `auths/`, uid / телефон / email аккаунта, Cookie-заголовки апстрима.
        >
        > Каждое поле обязательно. **Неприменимое отмечайте «неприменимо», действительно непредоставимое — «не могу предоставить» с указанием причины — не оставляйте пустым, не пишите «не знаю».**

  - type: checkboxes
    id: preflight
    attributes:
      label: Предварительная проверка
      options:
        - label: Я удалил(а) по вышеуказанным требованиям все учётные данные и приватную информацию аккаунтов
          required: true
        - label: Я поискал(а) среди существующих issues (включая закрытые) и убедился, что это не дубликат
          required: true
        - label: Я воспроизвёл проблему прямым вызовом шлюза через curl и убедился, что дело не на стороне клиента
          required: true

  - type: textarea
    id: summary
    attributes:
      label: Краткое описание проблемы
      description: "В 1–3 предложениях: «что сделали → что получили → что ожидали». Запрещено писать просто «ошибка» / «не работает»."
      placeholder: |
        При вызове POST /v1/chat/completions со stream=true соединение разрывается до получения первого приращения тела;
        ожидается нормальный вывод полных SSE-кадров вплоть до [DONE].
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Минимальные шаги начиная с чистого состояния, чтобы другой человек мог повторить. Что можно оформить командой — оформите командой.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: frequency
    attributes:
      label: Частота воспроизведения и условия
      description: Например «7 раз из 10», «только при конкурентности ≥ 2», «только при ротации на 3-й аккаунт»; для нестабильных проблем опишите закономерность.
      placeholder: "Воспроизводится всегда / N раз из 10 / Только при определённых условиях (условие: ___)"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
      description: Чёткий проверяемый ожидаемый результат.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Фактически наблюдаемый результат, вставьте оригинальный текст ошибки (не пересказывайте, не прикладывайте только скриншот с выводом).
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Область воздействия
      description: Затронутый эндпоинт или подсистема (можно выбрать несколько).
      multiple: true
      options:
        - "POST /v1/chat/completions (без стриминга)"
        - "POST /v1/chat/completions (стриминг SSE)"
        - "Вызовы инструментов / tool_calls"
        - "Система системных промптов (custom / passthrough)"
        - "Пул аккаунтов / выбор аккаунта / привязка сессии"
        - "Автоматы и охлаждение (402 / 404 / 429)"
        - "Задачи по расписанию (отметка / активность / путешествия / keep-alive)"
        - "Персистентность состояния (state.json / Upstash)"
        - "Аутентификация / лимит размера тела запроса"
        - "Другое (уточните ниже)"
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Информация об окружении
      description: Заполните построчно. Версию указывайте как release tag или commit hash, не пишите «последняя версия».
      value: |
        - Версия проекта (release tag или commit hash):
        - Способ развёртывания (Docker Compose / сборка из исходников / другое):
        - Тег образа или полная команда запуска:
        - Версия Go (при сборке из исходников):
        - Клиент (тип + версия, напр. Cherry Studio x.y.z / OpenAI SDK x.y.z / curl):
        - ОС и версия:
        - Количество и состояние апстрим-аккаунтов (сколько доступно / в охлаждении / в автомате):
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Действующая конфигурация
      description: Вставьте фактически действующую конфигурацию (`config.json` или переопределения через переменные окружения). `api_key`, `upstash.token` обязательно замаскируйте; неизменённые поля можно опустить, но укажите, что опущено.
      render: json
      placeholder: |
        {
          "listen": ":7863",
          "server": { "max_body_mb": 8 },
          "prompt": { "mode": "custom" },
          "features": { "sanitize_blacklist_fingerprints": true }
        }
    validations:
      required: true

  - type: textarea
    id: request
    attributes:
      label: "Минимальное воспроизведение: запрос к шлюзу"
      description: Готовая к выполнению команда curl (URL и ключ можно замаскировать) или полное тело запроса в JSON, реально отправленное клиентом. Должны присутствовать `model`, `messages`, `stream`, при вызовах инструментов — `tools` / `tool_choice`.
      render: shell
      placeholder: |
        curl -sS -N http://127.0.0.1:7863/v1/chat/completions \
          -H "Authorization: Bearer $API_KEY" \
          -H "Content-Type: application/json" \
          -d '{"model":"...","messages":[...],"stream":true}'
    validations:
      required: true

  - type: textarea
    id: response
    attributes:
      label: "Минимальное воспроизведение: ответ шлюза"
      description: Полный исходный ответ. Для нестримингового — JSON с пометкой ниже, пусты ли `finish_reason` / `content` / `tool_calls`; для стриминга — полная последовательность SSE-кадров (включая наличие `[DONE]` в конце, без обрезки).
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Логи шлюза и стектрейсы
      description: Полные логи за окно сбоя (лог уровня запроса — одна строка на запрос, не прикладывайте только одну строку). Стек ошибки вставьте как есть.
      render: shell
    validations:
      required: true

  - type: textarea
    id: upstream_compare
    attributes:
      label: Контрольная проверка
      description: Чтобы отличить «дефект шлюза» от «ограничения апстрима». На каждый пункт обязательно ответьте, неприменимое — «неприменимо».
      value: |
        - Попадал ли тот же запрос в момент сбоя на несколько аккаунтов (была ли смена аккаунта):
        - Ошибка только на определённом аккаунте / определённой модели:
        - Вывод `/status` за этот период (пул аккаунтов, охлаждение, состояние автоматов, uid замаскируйте):
        - Нормально ли работает клиент напрямую с другим OpenAI-совместимым сервисом (исключение проблемы клиента):
        - Это регрессия «раньше работало → теперь не работает»? Если да, версии и изменённые настройки между двумя моментами:
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Дополнительная информация
      description: Есть ли доступный workaround, ссылки на связанные issue, время возникновения (с часовым поясом) и т.д.
    validations:
      required: false
