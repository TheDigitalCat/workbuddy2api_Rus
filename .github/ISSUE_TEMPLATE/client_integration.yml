name: Проблема интеграции клиента
description: После подключения клиентов (Codex / Cherry Studio / различные OpenAI SDK и т.д.) к шлюзу функции работают ненормально (чтение файлов, вызов инструментов, обрывы стриминга, таймауты и т.д.)
title: "[Client] Имя клиента + действие с ошибкой + симптом, напр.: Codex не читает локальные файлы"
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > **Заголовки вида «XX клиент не работает / не читает файлы» рассматриваться не будут.** У одного и того же симптома есть как минимум несколько несовместимых причин, различить их можно только по сообщениям и логам:
        >
        > - клиент отправил запрос на неверный base_url / протокол, запрос **вообще не дошёл до шлюза**;
        > - запрос дошёл до шлюза, но нужные клиенту поля (например `tools`, `tool_calls`, `parallel_tool_calls`, `stream_options`) не поддерживаются апстримом или были переписаны;
        > - шлюз ответил нормально, но проблема в разборе / настройке самого клиента (не включены инструменты, длина контекста, настройки прокси);
        > - у апстрима есть ограничения на такую форму ввода (вложения, длинный контекст, отдельные типы файлов).
        >
        > **Заполните пункты ниже по порядку. Неприменимое отмечайте «неприменимо», непредоставимое — «не могу предоставить» с указанием причины, не оставляйте пустым.** Без ключевых пунктов issue будет закрыто как «невоспроизводимое».
        >
        > Дополнительно: перед подключением прочитайте в README разделы [Эндпоинты API](https://github.com/Sliverkiss/workbuddy2api#api-эндпоинты) и [Детали потокового режима](https://github.com/Sliverkiss/workbuddy2api#детали-потокового-режима), убедитесь, что нужные клиенту возможности заявлены как поддерживаемые в текущей реализации.

  - type: checkboxes
    id: preflight
    attributes:
      label: Предварительная проверка
      options:
        - label: Я прогнал запрос того же типа напрямую к шлюзу через curl и убедился, что сам шлюз работает
          required: true
        - label: Я убедился, что base_url клиента указывает на этот шлюз с путём /v1 и api_key совпадает со шлюзом
          required: true
        - label: Я замаскировал чувствительные данные (api_key, токены auths, uid / телефон аккаунта, Cookie апстрима)
          required: true

  - type: input
    id: client
    attributes:
      label: Клиент и версия
      description: Точный номер версии, не пишите «последняя версия».
      placeholder: "Напр.: Codex CLI 0.4x.x / Cherry Studio 1.x.x / openai-python 1.x.x"
    validations:
      required: true

  - type: textarea
    id: client_config
    attributes:
      label: Конфигурация клиента
      description: Фрагмент конфигурации, связанный с моделью / шлюзом (включая base_url, model, включены ли вызовы инструментов / вложения / стриминг). Секреты замаскируйте. Скриншоты дублируйте текстом.
      render: text
      placeholder: |
        base_url: http://127.0.0.1:7863/v1
        model: ...
        tools: enabled
        stream: true
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Минимальные шаги от запуска клиента до проявления ошибки, включая конкретное действие (например «попросить модель прочитать ./main.go»).
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Ожидаемое поведение / фактическое поведение
      description: Опишите отдельно. Текст ошибки и лог клиента вставляйте оригиналом, не ограничивайтесь описанием или скриншотом.
      value: |
        - Ожидаемое:
        - Фактическое:
        - Оригинальный текст ошибки на стороне клиента:
        - Есть ли у клиента отдельные переключатели «вызов инструментов», «вложения», «чтение файлов»? Текущее состояние:
    validations:
      required: true

  - type: input
    id: reached_gateway
    attributes:
      label: Дошёл ли запрос до шлюза
      description: Определите по меткам времени в логах шлюза. Этот пункт решает, проблема на стороне клиента или шлюза.
      placeholder: Да (есть соответствующая строка в логе) / Нет (записи в логе нет) / Не могу определить
    validations:
      required: true

  - type: textarea
    id: request
    attributes:
      label: Исходное тело запроса
      description: Полное тело запроса, реально отправленного клиентом шлюзу (из логов клиента, захвата трафика или логов шлюза). Должны присутствовать `model`, `messages`, `stream`, `tools`, `tool_choice`. Отсутствующие поля пометьте «клиент не отправлял».
      render: json
    validations:
      required: true

  - type: textarea
    id: response
    attributes:
      label: Исходное тело ответа
      description: Полный исходный ответ. Для стриминга вставьте полную последовательность SSE-кадров (включая наличие `[DONE]`, наличие инкрементальных кадров `tool_calls`), без обрезки, не только начало и конец.
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Логи шлюза
      description: Полные строки лога уровня запроса, покрывающие этот запрос, а также любые ошибки и стектрейсы оригиналом.
      render: shell
    validations:
      required: true

  - type: textarea
    id: compare
    attributes:
      label: Контрольная проверка
      description: "Чтобы понять, что это: «несовместимость протокола», «дефект шлюза» или «ограничение апстрима». На каждый пункт обязательно ответьте, неприменимое — «неприменимо»."
      value: |
        - Прямое воспроизведение через curl: отправьте тот же запрос шлюзу через curl, каков результат? (приложите команду и результат)
        - Нормально ли работает без стриминга (stream=false)?
        - Нормально ли работает обычный диалог без чтения файлов / вызовов инструментов?
        - Нормально ли работает другой клиент (или SDK), направленный на тот же шлюз?
        - Ошибка только на определённой модели, определённом типе / размере файлов, файлах на определённом языке?
        - Это регрессия «раньше работало, теперь не работает»? Если да, до каких версий обновились клиент и шлюз за это время:
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Окружение запуска
      description: ОС / контейнерное окружение на стороне шлюза и на стороне клиента, а также сетевая связность между ними (та же машина / локальная сеть / обратный прокси / туннель).
      placeholder: "Шлюз: Debian 12 + Docker 24; клиент: Windows 11; сеть: та же машина 127.0.0.1"
    validations:
      required: true

  - type: dropdown
    id: gateway_version
    attributes:
      label: Источник версии шлюза
      description: Чтобы понять, известная ли это проблема.
      options:
        - "Тег релиза / официальный образ"
        - "Самостоятельная сборка из исходников ветки master"
        - "Форк или сторонняя модификация (укажите какая)"
        - "Не уверен(а)"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Дополнительная информация
      description: Известные workaround, ссылки на связанные issue, ссылки на файлы захвата трафика и т.д.
    validations:
      required: false
