name: Запрос функции
description: Предложить новую возможность, изменение поведения или улучшение опыта развёртывания / настройки
title: "[Feature] Одним предложением опишите, что хотите добавить или изменить"
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > Запрос функции должен фокусироваться на **проблеме и цели**, а не сразу на решении в коде. Ресурсы на поддержку репозитория ограничены, поэтому опишите реальный сценарий использования и частоту, чтобы можно было оценить приоритет.
        >
        > Каждый пункт обязателен. **Неприменимое отмечайте «неприменимо», непредоставимое — «не могу предоставить» с указанием причины.**

  - type: checkboxes
    id: preflight
    attributes:
      label: Предварительная проверка
      options:
        - label: Я поискал(а) среди существующих issues и обсуждений (Discussions) и убедился, что такого же или похожего запроса нет
          required: true
        - label: Я убедился, что эта возможность сейчас недостижима существующей конфигурацией (см. раздел «Описание конфигурации» в README)
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Решаемая проблема
      description: Опишите конкретную текущую боль и сценарий, не пишите просто «хочу поддержку X».
      placeholder: |
        В сценарии ___ мне нужно ___, но сейчас я могу только ___, из-за чего ___ (лишнее время / невыполнимая задача).
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Предлагаемое решение
      description: Ожидаемое поведение, включая имена настроек, значения по умолчанию, связь с существующей семантикой (например взаимодействие с пулом аккаунтов / промптами / стратегией охлаждения). Можно привести пример API или конфигурации.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Рассмотренные альтернативы
      description: Какие обходные пути, внешние инструменты или менее затратные изменения уже есть; почему они не подходят. Если нет — пишите «неприменимо».
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Затрагиваемая область
      description: Подсистемы, которых, вероятно, коснётся изменение (можно выбрать несколько).
      multiple: true
      options:
        - "OpenAI-совместимый интерфейс / поведение протокола"
        - "Вызовы инструментов / tool_calls"
        - "Система системных промптов"
        - "Пул аккаунтов / выбор аккаунта / привязка сессии"
        - "Стратегия автоматов и охлаждения"
        - "Задачи по расписанию"
        - "Персистентность состояния / Redis"
        - "Наблюдаемость (логи / health-проверки)"
        - "Развёртывание и конфигурация"
        - "Документация"
        - "Другое (уточните ниже)"
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Связанное окружение
      description: Контекст окружения, связанный с запросом; не связанный — «неприменимо».
      value: |
        - Версия проекта (тег релиза или хеш коммита):
        - Способ развёртывания:
        - Клиент и версия:
        - Сценарий использования и частота (например N раз в день / только тестовое окружение):
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Готовность участвовать
      options:
        - label: Я готов(а) отправить PR с реализацией этой функции
        - label: Я готов(а) помочь с тестированием и обратной связью

  - type: textarea
    id: additional
    attributes:
      label: Дополнительная информация
      description: Ссылки на связанные issue, описание ограничений апстрима, основания в спецификациях протокола и т.д.
    validations:
      required: false
