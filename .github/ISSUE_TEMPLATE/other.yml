name: Прочее / отзывы о документации и совместимости
description: Ошибки в документации, изменения поведения апстрима, наблюдения о совместимости или другие вопросы, не подходящие под категории выше
title: "[Other] Опишите одним предложением"
labels: []
body:
  - type: markdown
    attributes:
      value: |
        > [!NOTE]
        > Этот шаблон для случаев, **не подходящих** под «Сообщение об ошибке» и «Запрос функции», например: описание в README не совпадает с кодом, изменилось поведение интерфейса апстрима (CodeBuddy), изменилась доступность моделей.
        > Если это вопрос по использованию, помощь с развёртыванием или вы не уверены, дефект ли это, обратитесь в [Discussions Q&A](https://github.com/Sliverkiss/workbuddy2api/discussions/categories/q-a).
        >
        > **Каждый пункт обязателен. Неприменимое отмечайте «неприменимо», непредоставимое — «не могу предоставить» с указанием причины.**

  - type: input
    id: topic
    attributes:
      label: Тема
      description: Обобщите одним предложением. Избегайте неинформативных формулировок вроде «есть проблема» / «плохо работает».
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: Подробное описание
      description: Что именно? Какого раздела документации, фрагмента кода, эндпоинта апстрима или поведения это касается? Приведите проверяемый источник (путь к файлу + номер строки, раздел README, тело ответа апстрима).
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Подтверждения
      description: Связанные логи, сообщения, скриншоты, ссылки. Для проблем документации приведите сопоставление «как написано в документации» и «как на самом деле».
      render: text
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Информация об окружении
      description: Окружение, связанное с темой; если не связано — пишите «неприменимо».
      value: |
        - Версия проекта (тег релиза или хеш коммита):
        - Способ развёртывания:
        - Клиент и версия:
    validations:
      required: true
